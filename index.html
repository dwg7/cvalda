<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cvalda</title>
  </head>
  <body>
    <div id="map"></div>
    <div class="panel" id="panel">
      <div class="panel-head">
        <h1>cvalda</h1>
        <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body" title="Hide or show this panel">Hide</button>
      </div>
      <div id="panel-body">
      <div id="modes"></div>
      <div id="legend"></div>
      <label><input type="checkbox" id="t-photo" />GSI aerial photo</label>
      <div class="slider" id="slider-box">
        <label for="thr"><span id="slider-text"></span> <b id="thr-val">50%</b> of it</label>
        <input type="range" id="thr" min="5" max="95" step="5" value="50" />
      </div>
      <p class="hint" id="status"></p>
      <div class="places" id="places"></div>
      <div class="export">
        <div class="export-title">Export what you see</div>
        <div class="export-buttons">
          <button id="x-geojson" type="button">GeoJSON</button>
          <button id="x-fgb" type="button">FlatGeobuf</button>
        </div>
        <p class="hint" id="export-status">Zoom in to level 15 or more to export.</p>
      </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
